name: Задача для Claude Code
description: Одна задача = одна ветка = один PR
labels: []
body:
  - type: textarea
    id: context
    attributes:
      label: Контекст
      description: Ссылки на разделы docs и артборды макета
    validations:
      required: true
  - type: textarea
    id: todo
    attributes:
      label: Что сделать
    validations:
      required: true
  - type: textarea
    id: ac
    attributes:
      label: Критерии приёмки
      value: "- [ ] "
    validations:
      required: true
  - type: textarea
    id: out
    attributes:
      label: Не делать
