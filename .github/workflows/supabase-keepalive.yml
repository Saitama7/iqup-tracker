# Supabase Free ставит проект на паузу после 7 дней без запросов — пингуем раз в день.
name: Supabase keepalive
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping prod
        run: |
          curl -fsS "${{ secrets.SUPABASE_URL }}/rest/v1/holidays?select=day&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" > /dev/null
