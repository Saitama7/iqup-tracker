name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: has
        run: echo "pkg=$([ -f package.json ] && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"
      - if: steps.has.outputs.pkg == '1'
        uses: pnpm/action-setup@v4 # version from package.json packageManager
      - if: steps.has.outputs.pkg == '1'
        uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - if: steps.has.outputs.pkg == '1'
        run: pnpm install --frozen-lockfile
      - if: steps.has.outputs.pkg == '1'
        run: pnpm lint
      - if: steps.has.outputs.pkg == '1'
        run: pnpm typecheck
      - if: steps.has.outputs.pkg == '1'
        run: pnpm test -- --run
      - if: steps.has.outputs.pkg == '1'
        run: cp .env.example .env
      - if: steps.has.outputs.pkg == '1'
        run: pnpm build
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from package.json packageManager
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      # Auth e2e signs in seed users against the local stack (playwright.config reads `supabase status`)
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: supabase start -x studio,imgproxy,storage-api,logflare,vector,mailpit,postgres-meta,realtime,supavisor,edge-runtime
      - run: pnpm seed:users
      - run: pnpm exec playwright install --with-deps webkit
      - run: pnpm e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      # Auth + PostgREST + Kong are needed for seed:users and the Edge Function tests
      - run: supabase start -x studio,imgproxy,storage-api,logflare,vector,mailpit,postgres-meta,realtime,supavisor
      - run: supabase test db
      - uses: pnpm/action-setup@v4 # version from package.json packageManager
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm seed:users
      - name: Serve Edge Functions
        run: |
          supabase functions serve > functions.log 2>&1 &
          for i in $(seq 1 60); do grep -q "Serving functions" functions.log && exit 0; sleep 3; done
          cat functions.log; exit 1
      - run: pnpm test:integration
      - if: failure()
        run: cat functions.log || true
