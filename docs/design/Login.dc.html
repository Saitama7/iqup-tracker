<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">

</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
/* бейджи и числа никогда не переносятся */
span[style*="border-radius: 999px"],span[style*="border-radius:999px"],span[style*="border-radius: 8px"],span[style*="border-radius: 6px"],td.num,td>a,.nw{white-space:nowrap}
span[style*="border-radius: 999px"],span[style*="border-radius:999px"]{display:inline-block;line-height:1.3}
a{color:#1C8C9E;text-decoration:none}a:hover{color:#146f7e}
input{font-family:inherit}
input::placeholder{color:#A8A08A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F2C230; font-family: Manrope, system-ui, sans-serif; color: #141414; display: flex; flex-direction: column; overflow: hidden; position: relative">

  <div style="position: absolute; left: -80px; top: -60px; width: 300px; height: 300px; border-radius: 150px; background: #F7D45C"></div>
  <div style="position: absolute; right: -110px; top: 120px; width: 260px; height: 260px; border-radius: 130px; background: #EBB81C"></div>

  <div style="position: relative; padding: 96px 28px 0 28px; display: flex; flex-direction: column; gap: 22px; align-items: flex-start">
    <div style="width: 96px; height: 96px; border-radius: 48px; background: #FFFDF6; display: flex; align-items: center; justify-content: center; box-shadow: 0 16px 32px rgba(20,20,20,0.18)">
      <div style="font-family: Unbounded, sans-serif; font-size: 22px; font-weight: 800; letter-spacing: -0.02em">IQ UP</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="font-family: Unbounded, sans-serif; font-size: 30px; font-weight: 800; line-height: 1.1">Tracker</div>
      <div style="font-size: 15px; font-weight: 700; opacity: 0.75; line-height: 1.4">Занятия, посещаемость<br>и зарплата — без споров</div>
    </div>
  </div>

  <div style="position: relative; margin-top: auto; background: #FFFDF6; border-radius: 32px 32px 0 0; padding: 28px 24px 40px 24px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 -16px 40px rgba(20,20,20,0.12)">
    <div style="font-family: Unbounded, sans-serif; font-size: 18px; font-weight: 700">Вход</div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="phone" style="font-size: 12px; font-weight: 800; color: #6B6B6B; letter-spacing: 0.04em; text-transform: uppercase">Номер телефона</label>
      <div style="display: flex; align-items: center; gap: 10px; background: #FFFFFF; border: 1.5px solid #E3DCC6; border-radius: 16px; padding: 0 16px; min-height: 56px">
        <span style="font-size: 16px; font-weight: 800; color: #6B6B6B">+996</span>
        <input id="phone" type="tel" placeholder="552 775 771" style="flex: 1 1 auto; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 17px; font-weight: 700; color: #141414; padding: 0; height: 52px">
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="password" style="font-size: 12px; font-weight: 800; color: #6B6B6B; letter-spacing: 0.04em; text-transform: uppercase">Пароль</label>
      <div style="display: flex; align-items: center; gap: 10px; background: #FFFFFF; border: 1.5px solid #E3DCC6; border-radius: 16px; padding: 0 16px; min-height: 56px">
        <input id="password" type="password" placeholder="••••••••" style="flex: 1 1 auto; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 17px; font-weight: 700; color: #141414; padding: 0; height: 52px">
        <button type="button" aria-label="Показать пароль" style="border: 0; background: transparent; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; margin-right: -10px; cursor: pointer">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6B6B6B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>

    <a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 56px; border-radius: 18px; background: #141414; color: #F2C230; font-size: 16px; font-weight: 800; margin-top: 4px; box-shadow: 0 12px 28px rgba(20,20,20,0.22)">
      Войти
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F2C230" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a>

    <div style="text-align: center; font-size: 13px; font-weight: 700; color: #6B6B6B">Забыли пароль? Обратитесь к администратору</div>
  </div>
</div>
</x-dc>
